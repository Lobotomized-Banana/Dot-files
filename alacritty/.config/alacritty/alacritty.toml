# Purple Squircle PREVIEW - NOT yet active
# Test with: alacritty --config-file ~/.config/alacritty/alacritty-purple-preview.toml
# If you like it: cp ~/.config/alacritty/alacritty-purple-preview.toml ~/.config/alacritty/alacritty.toml
#   (and tell me to make it permanent in dotfiles)
# Your current live config is backed up at ~/.alacritty.toml.bak

[window]
opacity = 0.92
blur = true
padding = { x = 12, y = 12 }
decorations = "full"
dynamic_title = true

[font]
size = 11.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[colors.primary]
background = "#0e0716"
foreground = "#ece5f7"
dim_foreground = "#a898c2"
bright_foreground = "#ffffff"

[colors.cursor]
text = "#0e0716"
cursor = "#8b2fe0"

[colors.selection]
text = "#ffffff"
background = "#5b0ca6"

[colors.normal]
black = "#1e0e2e"
red = "#ff5577"
green = "#7dd8a8"
yellow = "#e8c47a"
blue = "#8b2fe0"
magenta = "#5b0ca6"
cyan = "#7ab8e8"
white = "#a898c2"

[colors.bright]
black = "#2a1540"
red = "#ff7a93"
green = "#9ae8c0"
yellow = "#f0d49a"
blue = "#a855f7"
magenta = "#7a1fc2"
cyan = "#9ad0f0"
white = "#ece5f7"

# Purple acrylic hints
[colors.hints.start]
foreground = "#0e0716"
background = "#e8c47a"

[colors.hints.end]
foreground = "#0e0716"
background = "#7dd8a8"
